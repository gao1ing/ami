server:
  address: 127.0.0.1
  port: ${AMI_PORT:8080}

spring:
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
  application:
    name: ami-demo
  datasource:
    url: ${AMI_DB_URL:jdbc:mysql://127.0.0.1:3306/ami_demo?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${AMI_DB_USERNAME:}
    password: ${AMI_DB_PASSWORD:}
    hikari:
      connection-timeout: 3000
  data:
    redis:
      host: ${AMI_REDIS_HOST:127.0.0.1}
      port: ${AMI_REDIS_PORT:6379}
      password: ${AMI_REDIS_PASSWORD:}
  sql:
    init:
      mode: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
